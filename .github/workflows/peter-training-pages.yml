name: Deploy Peter Training OS

on:
  push:
    branches: [main]
    paths:
      - 'peter-training/**'
      - '.github/workflows/peter-training-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: peter-training-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./peter-training
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
